name: AutoX Build Final

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    # 【核心改动】：使用 20.04 的老系统，避开最新的 SDK 34 冲突！
    runs-on: ubuntu-20.04 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Fix Permissions and Path
        run: |
          chmod +x gradlew
          mkdir -p app/src/main/assets/project
          [ -f main.js ] && cp main.js app/src/main/assets/project/ || true
          [ -f project.json ] && cp project.json app/src/main/assets/project/ || true
          [ -f icon.png ] && cp icon.png app/src/main/assets/project/ || true

      - name: Build APK
        run: |
          # 在老系统里直接编译
          ./gradlew :app:assembleDebug -x lint --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Rapid-Hunter-App
          path: app/build/outputs/apk/debug/*.apk