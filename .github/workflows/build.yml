name: AutoX.js Build APK

on:
  push:
    branches: [ "main" ] 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # 升级到 v4
        uses: actions/checkout@v4

      - name: Set up JDK 11
        # 升级到 v4
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install AutoX Build Tool
        run: |
          npm install -g autox-builder

      - name: Build APK
        run: |
          # 确保你的项目根目录下有 project.json
          autox-builder build . --output ./build/rapid_hunter.apk

      - name: Upload APK
        # 【关键修复】升级到 v4
        uses: actions/upload-artifact@v4
        with:
          name: Rapid-Hunter-APK
          path: ./build/rapid_hunter.apk