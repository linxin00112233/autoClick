name: AutoX.js Build APK

on:
  push:
    branches: [ "main" ] # 每次推送到 main 分支时触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install AutoX Build Tool
        run: |
          # 这里使用的是社区常用的 AutoX 命令行打包工具
          npm install -g autox-builder

      - name: Build APK
        run: |
          # 假设你的脚本和 project.json 在项目根目录
          autox-builder build . --output ./build/rapid_hunter.apk

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Rapid-Hunter-APK
          path: ./build/rapid_hunter.apk