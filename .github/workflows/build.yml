name: AutoX Build Final

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 暴力抹除 SDK 34 解决兼容报错
        run: |
          echo "正在删除 GitHub 服务器上过新的 SDK 34，防止旧模版解析崩溃..."
          sudo rm -rf $ANDROID_HOME/build-tools/34.*
          sudo rm -rf $ANDROID_HOME/platforms/android-34
          sudo rm -rf $ANDROID_HOME/platforms/android-35
          echo "删除完成！"

      - name: 修复文件权限与路径
        run: |
          chmod +x gradlew
          mkdir -p app/src/main/assets/project
          [ -f main.js ] && cp main.js app/src/main/assets/project/ || true
          [ -f project.json ] && cp project.json app/src/main/assets/project/ || true
          [ -f icon.png ] && cp icon.png app/src/main/assets/project/ || true

      - name: Build APK (使用老旧环境编译)
        run: |
          # 不再强行升级 Gradle，直接用它自带的环境打包
          ./gradlew :app:assembleDebug -x lint --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Rapid-Hunter-App
          path: app/build/outputs/apk/debug/*.apk