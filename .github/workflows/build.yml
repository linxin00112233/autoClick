name: AutoX Build Final

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11 # 先用 JDK 11，防止旧版 Gradle 直接崩溃
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Auto-Fix Project Structure
        run: |
          # 自动寻找并赋予 gradlew 权限
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "错误：找不到 gradlew 文件！"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          
          # 确保 assets 路径
          mkdir -p app/src/main/assets/project
          find . -name "main.js" -exec cp {} app/src/main/assets/project/ \;
          find . -name "project.json" -exec cp {} app/src/main/assets/project/ \;
          find . -name "icon.png" -exec cp {} app/src/main/assets/project/ \;

      - name: Upgrade Gradle to 8.0
        run: |
          # 在 JDK 11 环境下安全升级 Gradle
          ./gradlew wrapper --gradle-version 8.0

      - name: Switch to JDK 17 # 升级完 Gradle 后，切回 JDK 17 以支持安卓编译
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # 开始最终打包
          ./gradlew :app:assembleDebug -x lint --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Rapid-Hunter-App
          path: app/build/outputs/apk/debug/*.apk