name: AutoX Build Final

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 # 升级到 JDK 17 以支持新版 Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Permissions and Path
        run: |
          chmod +x gradlew
          mkdir -p app/src/main/assets/project
          [ -f main.js ] && cp main.js app/src/main/assets/project/
          [ -f project.json ] && cp project.json app/src/main/assets/project/
          [ -f icon.png ] && cp icon.png app/src/main/assets/project/

      - name: Upgrade Gradle to 8.0 # 强力升级以解决 34x 报错
        run: |
          ./gradlew wrapper --gradle-version 8.0

      - name: Build APK with Gradle
        run: |
          # 使用 --no-daemon 模式更稳定
          ./gradlew :app:assembleDebug -x lint --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Rapid-Hunter-App
          path: app/build/outputs/apk/debug/*.apk