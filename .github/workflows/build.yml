name: 强制老旧环境打包 CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    # 【核心破局点】：绝对不能用 ubuntu-latest！
    # 强制使用 ubuntu-20.04，这台老服务器里没有那个让你报错的 SDK 34！
    runs-on: ubuntu-20.04 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 11 环境 (配合老服务器)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 修复文件与权限
        run: |
          # 1. 找 gradlew 并给权限
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
          else
            echo "找不到 gradlew"
          fi
          
          # 2. 强行把你的脚本放进安卓资源目录
          mkdir -p app/src/main/assets/project
          find . -name "main.js" -exec cp {} app/src/main/assets/project/ \; || true
          find . -name "project.json" -exec cp {} app/src/main/assets/project/ \; || true
          find . -name "icon.png" -exec cp {} app/src/main/assets/project/ \; || true

      - name: 开始编译 APK
        run: |
          # 使用旧环境直接跑，不升降级
          ./gradlew :app:assembleDebug -x lint --no-daemon --stacktrace

      - name: 上传 APK 包
        uses: actions/upload-artifact@v4
        with:
          name: AutoX-App-Build
          path: app/build/outputs/apk/debug/*.apk